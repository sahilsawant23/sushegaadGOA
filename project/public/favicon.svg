<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra-vibrant Neon Tropical Sunset Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="45%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>

    <!-- Ocean Wave Overlay Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Inner Glow & Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Tropical Sunset Gradient -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#mainGrad)" />

  <!-- Soft Radiant Sun Overlay -->
  <circle cx="256" cy="190" r="110" fill="#FFFFFF" opacity="0.18" />
  <circle cx="256" cy="190" r="85" fill="#FFFFFF" opacity="0.25" />

  <!-- Tropical Ocean Waves at Bottom -->
  <path d="M 16 340 C 120 310, 180 370, 270 340 C 350 315, 420 365, 496 345 L 496 416 C 496 462, 460 496, 414 496 L 98 496 C 52 496, 16 462, 16 416 Z" fill="url(#waveGrad)" opacity="0.95" />

  <!-- Palm Tree & Coconuts Centerpiece -->
  <g filter="url(#glow)">
    <!-- Trunk -->
    <path d="M 248 160 Q 262 260 274 340 L 244 340 Q 236 260 240 160 Z" fill="#FFFFFF" />

    <!-- Palm Fronds -->
    <path d="M 246 165 C 246 110, 220 80, 180 70 C 225 90, 240 125, 246 165 Z" fill="#FFFFFF" />
    <path d="M 246 165 C 246 110, 272 80, 312 70 C 267 90, 252 125, 246 165 Z" fill="#FFFFFF" />

    <path d="M 246 165 C 210 135, 140 130, 100 155 C 150 155, 210 160, 246 165 Z" fill="#FFE600" />
    <path d="M 246 165 C 282 135, 352 130, 392 155 C 342 155, 282 160, 246 165 Z" fill="#FFE600" />

    <path d="M 246 165 C 190 170, 130 195, 110 235 C 145 210, 205 185, 246 165 Z" fill="#FFFFFF" />
    <path d="M 246 165 C 302 170, 362 195, 382 235 C 347 210, 287 185, 246 165 Z" fill="#FFFFFF" />

    <!-- Golden Coconuts -->
    <circle cx="236" cy="172" r="10" fill="#FFE600" />
    <circle cx="256" cy="176" r="10" fill="#FFE600" />
    <circle cx="246" cy="184" r="9" fill="#FFFFFF" />
  </g>

  <!-- Sparkle Stars for Hotstar-style brilliance -->
  <g filter="url(#starGlow)" fill="#FFFFFF">
    <path d="M 120 100 L 124 116 L 140 120 L 124 124 L 120 140 L 116 124 L 100 120 L 116 116 Z" />
    <path d="M 390 100 L 393 110 L 403 113 L 393 116 L 390 126 L 387 116 L 377 113 L 387 110 Z" />
    <path d="M 256 45 L 259 57 L 271 60 L 259 63 L 256 75 L 253 63 L 241 60 L 253 57 Z" />
  </g>
</svg>
